name: Build and Test Api
on:
  push:
    branches: [ prod, dev]
  pull_request:
    branches: [ prod ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Install Grype
      id: install-grype
      run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sudo sh -s -- -b /usr/local/bin
    - name: Login to Docker Hub
      id: Login
      run: docker login -u ${{ secrets.DOCKER_USER }} -p ${{ secrets.DOCKER_PASSWORD }}
    - name: Build the Docker image
      id: build
      run: docker build . --file Dockerfile --tag ${{ secrets.DOCKER_USER }}/simple-golang-api:$(git rev-parse --short "$GITHUB_SHA")
    - name: Scan Image for vulnerabilities
      id: vul-scan
      run: grype -f critical ${{ secrets.DOCKER_USER }}/simple-golang-api:$(git rev-parse --short "$GITHUB_SHA")
    - name: Push the Docker image
      id: push 
      run: docker push ${{ secrets.DOCKER_USER }}/simple-golang-api:$(git rev-parse --short "$GITHUB_SHA")